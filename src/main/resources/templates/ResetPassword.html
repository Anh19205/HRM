<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Đổi Mật Khẩu</title>

  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Tái sử dụng style từ trang quản lý tài khoản -->
  <style>
    /* Copy các :root, body, .btn, .card, .toast-container,... từ trang cũ của bạn */
    /* Hoặc include chung file css nếu bạn đã tách ra */
    .form-container { max-width: 480px; margin: 60px auto; }
    .card { border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
  </style>
</head>
<body class="bg-light">

 <div th:replace="Navbar :: navbar"></div>

  <div class="container form-container">
    <div class="card p-4 p-md-5">
      <h3 class="text-center mb-4">Đổi mật khẩu</h3>

      <form id="changePasswordForm">
        <div class="mb-3">
          <label for="currentPassword" class="form-label">Mật khẩu hiện tại <span class="text-danger">*</span></label>
          <input type="password" class="form-control" id="currentPassword" required minlength="6">
        </div>

        <div class="mb-3">
          <label for="newPassword" class="form-label">Mật khẩu mới <span class="text-danger">*</span></label>
          <input type="password" class="form-control" id="newPassword" required minlength="6">
        </div>

        <div class="mb-3">
          <label for="confirmNewPassword" class="form-label">Xác nhận mật khẩu mới <span class="text-danger">*</span></label>
          <input type="password" class="form-control" id="confirmNewPassword" required minlength="6">
        </div>

        <div class="d-grid">
          <button type="submit" class="btn btn-primary btn-lg">Cập nhật mật khẩu</button>
        </div>
      </form>

      <div class="text-center mt-4">
        <a href="/" class="text-muted">Quay về trang chính</a>
      </div>
    </div>
  </div>

  <!-- Toast container -->
  <div class="toast-container position-fixed top-0 end-0 p-3"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    const API_BASE = '/api/users'; // hoặc '/api/user' nếu bạn tách controller

    function showToast(message, type = 'success') {
      const toast = document.createElement('div');
      toast.className = `toast align-items-center text-bg-${type} border-0`;
      toast.innerHTML = `
        <div class="d-flex">
          <div class="toast-body">${message}</div>
          <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
        </div>
      `;
      document.querySelector('.toast-container').appendChild(toast);
      new bootstrap.Toast(toast, { autohide: true, delay: 4000 }).show();
    }

    document.getElementById('changePasswordForm').addEventListener('submit', async e => {
      e.preventDefault();

      const current = document.getElementById('currentPassword').value;
      const newPass = document.getElementById('newPassword').value;
      const confirm = document.getElementById('confirmNewPassword').value;

      if (newPass !== confirm) {
        showToast('Mật khẩu xác nhận không khớp!', 'danger');
        return;
      }

      if (newPass.length < 6) {
        showToast('Mật khẩu mới phải ít nhất 6 ký tự', 'danger');
        return;
      }

      try {
        const res = await fetch(`${API_BASE}/change-password`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + localStorage.getItem('token')
          },
          body: JSON.stringify({
            currentPassword: current,
            newPassword: newPass,
            confirmNewPassword: confirm
          })
        });

        const data = await res.json();

        if (res.ok && data.success) {
          showToast(data.message || 'Đổi mật khẩu thành công!', 'success');
          // Có thể logout sau 2 giây để buộc đăng nhập lại
          setTimeout(() => {
            localStorage.removeItem('token');
            window.location.href = '/login';
          }, 2000);
        } else {
          showToast(data.message || 'Đổi mật khẩu thất bại', 'danger');
        }
      } catch (err) {
        showToast('Lỗi kết nối: ' + err.message, 'danger');
      }
    });
  </script>
</body>
</html>
