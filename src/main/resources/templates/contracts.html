<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Hợp đồng Lao động</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        body { background: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card { border-radius: 14px; box-shadow: 0 10px 35px rgba(0,0,0,.08); border: none; }
        .header-gradient { background: linear-gradient(135deg,#11998e,#38ef7d); color:white; border-radius:14px; padding:2rem; margin-bottom:2rem; }
        .top-bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem; padding:1rem 0; }
        .top-bar h1 { margin:0; font-size:2rem; font-weight:600; }
        .subtitle { color:#6c757d; font-size:1rem; }
        .search-container { position:relative; margin-bottom:1.5rem; }
        .search-container input { padding-left:2.5rem; border-radius:8px; border:1px solid #ced4da; }
        .search-container .material-icons { position:absolute; left:0.75rem; top:50%; transform:translateY(-50%); color:#6c757d; }
        .table th { background-color:#343a40; color:white; font-weight:600; }
        .btn-primary { background:linear-gradient(135deg,#11998e,#38ef7d); border:none; transition:transform 0.2s; }
        .btn-primary:hover { transform:translateY(-2px); }
        .toast-container { position:fixed; top:20px; right:20px; z-index:2050; }
        
        /* Chỉnh sửa thêm cho Modal Xóa */
        .modal-confirm .modal-content { border-radius: 15px; border: none; }
        .modal-confirm .icon-box {
            width: 80px; height: 80px; margin: 0 auto;
            border-radius: 50%; color: #f15e5e; border: 3px solid #f15e5e;
            display: flex; align-items: center; justify-content: center;
        }

        /* ===== HERO (MATCH EMPLOYEE LIST) ===== */
.list-hero {
  background: linear-gradient(135deg, #1E3C72, #2A5298);
  border-radius: 20px;
  padding: 28px;
  color: #fff;
  box-shadow: 0 25px 60px rgba(30, 60, 114, 0.35);
  margin: 1.5rem 0 2rem;
}

.list-hero h1 {
  font-weight: 700;
  margin-bottom: 6px;
}

.list-hero p {
  opacity: 0.85;
  margin-bottom: 0;
}

/* ===== TABLE STYLE (MATCH EMPLOYEE LIST) ===== */
.card {
  background: #fff;
  border-radius: 18px;
  box-shadow: 0 15px 40px rgba(15, 23, 42, 0.08);
  border: none;
}

table {
  margin-bottom: 0;
}

.table th {
  background: #f1f3f5;
  font-weight: 600;
  color: #0f172a;
}

.table tr:hover {
  background: #f8f9fa;
}

/* ===== BADGE STYLE ===== */
.badge {
  padding: 6px 10px;
  font-size: 0.75rem;
  border-radius: 8px;
}

/* ===== ACTION BUTTON ===== */
.btn-outline-primary,
.btn-outline-danger {
  border-radius: 8px;
}

    </style>
</head>
<body>
    <div class="container my-4">
        <div th:replace="Navbar :: navbar"></div>

        <div class="list-hero d-flex justify-content-between align-items-center flex-wrap gap-3">
  <div>
    <h1>Quản lý Hợp đồng</h1>
    <p>Quản lý, theo dõi và cập nhật hợp đồng lao động</p>

    <div id="currentEmployeeInfo"
         class="mt-2 d-none px-3 py-2 bg-light text-dark rounded border-start border-4 border-success">
      Đang hiển thị cho: <strong id="employeeName"></strong>
    </div>
  </div>

  <button class="btn btn-warning d-inline-flex align-items-center shadow-sm"
          onclick="openAddModal()">
    <span class="material-icons me-1">add</span>
    Thêm hợp đồng
  </button>
</div>


        <div class="top-bar">
            <div>
                <div id="currentEmployeeInfo" class="mt-2 d-none p-2 bg-light border-start border-4 border-success rounded">
                    Đang hiển thị cho: <strong id="employeeName"></strong>
                </div>
            </div>
        </div>



        <div class="card p-3">
            <div class="table-responsive">
                <table class="table table-bordered table-hover align-middle" id="contractTable">
                    <thead>
                        <tr>
                            <th>Nhân viên</th>
                            <th>Loại hợp đồng</th>
                            <th>Mức lương</th>
                            <th>Thời hạn</th>
                            <th>Trạng thái</th>
                            <th>Thao tác</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>

<!-- Modal Thêm/Sửa hợp đồng -->
<div class="modal fade" id="contractModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Thêm / Sửa Hợp đồng</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <form id="contractForm">
        <div class="modal-body">
          <input type="hidden" id="contractId">
          <input type="hidden" id="employeeId">

          <div class="mb-3">
            <label class="form-label">Nhân viên</label>
            <select class="form-select" id="employeeSelect" required></select>
          </div>

          <div class="mb-3">
            <label class="form-label">Loại hợp đồng</label>
            <select class="form-select" id="contractType" required>
              <option value="FULL_TIME">Toàn thời gian</option>
              <option value="PART_TIME">Bán thời gian</option>
              <option value="INTERN">Thực tập</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label">Mức lương (VND)</label>
            <input type="number" class="form-control" id="salary" min="0" required>
          </div>

          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label">Ngày bắt đầu</label>
              <input type="date" class="form-control" id="startDate" required>
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label">Ngày kết thúc</label>
              <input type="date" class="form-control" id="endDate">
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
          <button type="submit" class="btn btn-primary">Lưu hợp đồng</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
// =============================================
// CẤU HÌNH & BIẾN TOÀN CỤC
// =============================================
const API_BASE = '/api';
let allContracts = [];
function openAddModal() {
    // Reset form về trạng thái trống
    document.getElementById('contractForm').reset();
    document.getElementById('contractId').value = '';
    
    // Nếu có nhân viên cố định từ URL, giữ nguyên select, ngược lại thì mở khóa
    const select = document.getElementById('employeeSelect');
    if (currentEmployeeId) {
        select.value = currentEmployeeId;
        select.disabled = true;
    } else {
        select.disabled = false;
    }

    document.querySelector('#contractModal .modal-title').textContent = 'Thêm hợp đồng mới';
    
    // Hiển thị modal
    const myModal = new bootstrap.Modal(document.getElementById('contractModal'));
    myModal.show();
}
// Lấy employeeId từ URL (nếu có)
const urlParams = new URLSearchParams(window.location.search);
const currentEmployeeId = urlParams.get('employeeId') || urlParams.get('id'); // hỗ trợ cả hai cách

console.log("currentEmployeeId từ URL:", currentEmployeeId);

// Nếu muốn bắt buộc phải có param thì thêm kiểm tra
if (!currentEmployeeId) {
  console.warn("Không tìm thấy employeeId trong URL → hiển thị tất cả hợp đồng");
}
// =============================================
// HÀM CHÍNH
// =============================================
async function loadContracts() {
  try {
    let url = `${API_BASE}/contracts`;
    
    // Chỉ lọc theo nhân viên nếu có currentEmployeeId hợp lệ
    if (currentEmployeeId && !isNaN(currentEmployeeId)) {
      url = `${API_BASE}/contracts/employee/${currentEmployeeId}`;
    }

    const res = await fetch(url, {
      headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
    });

    if (!res.ok) throw new Error(`HTTP ${res.status}`);

    const data = await res.json();
    allContracts = normalizeContracts(data); // xử lý nhiều dạng response

    renderContracts(allContracts);
    if (currentEmployeeId && allContracts.length > 0) {
      showCurrentEmployeeInfo(allContracts[0].employee);
    }

  } catch (err) {
    console.error("Lỗi tải hợp đồng:", err);
    document.querySelector('#contractTable tbody').innerHTML = 
      `<tr><td colspan="6" class="text-center text-danger py-4">Lỗi tải dữ liệu: ${err.message}</td></tr>`;
  }
}

function normalizeContracts(data) {
  if (Array.isArray(data)) return data;
  if (data?.contracts && Array.isArray(data.contracts)) return data.contracts;
  if (data?.data && Array.isArray(data.data)) return data.data;
  return [];
}

function showCurrentEmployeeInfo(employee) {
  if (!employee) return;
  document.getElementById('employeeName').textContent = 
    `${employee.firstName || ''} ${employee.lastName || ''} (${employee.email || '—'})`;
  document.getElementById('currentEmployeeInfo').classList.remove('d-none');
}

function renderContracts(contracts) {
  const tbody = document.querySelector('#contractTable tbody');
  tbody.innerHTML = contracts.map(c => `
    <tr>
      <td>${c.employee?.firstName || ''} ${c.employee?.lastName || ''}</td>
      <td><span class="badge bg-primary">${c.contractType || '—'}</span></td>
      <td>${Number(c.salary || 0).toLocaleString('vi-VN')} ₫</td>
      <td>
        ${c.startDate || '—'} → ${c.endDate || '<span class="text-success">Vô thời hạn</span>'}
      </td>
      <td>
        ${new Date(c.endDate) > new Date() || !c.endDate 
          ? '<span class="badge bg-success">Hiệu lực</span>' 
          : '<span class="badge bg-secondary">Hết hạn</span>'}
      </td>
      <td>
        <button class="btn btn-sm btn-outline-primary" onclick="editContract(${c.id})">Sửa</button>
        <button class="btn btn-sm btn-outline-danger" onclick="deleteContract(${c.id})">Xóa</button>
      </td>
    </tr>
  `).join('') || '<tr><td colspan="6" class="text-center py-4">Chưa có hợp đồng nào</td></tr>';
}

// =============================================
// LOAD NHÂN VIÊN CHO SELECT (khi thêm/sửa)
// =============================================
async function loadEmployeesForSelect() {
  try {
    const res = await fetch(`${API_BASE}/employees`, {
      headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
    });
    if (!res.ok) throw new Error("Không tải được nhân viên");

    const employees = normalizeContracts(await res.json()); // tái sử dụng hàm

    const select = document.getElementById('employeeSelect');
    select.innerHTML = '<option value="">Chọn nhân viên...</option>' +
      employees.map(e => `
        <option value="${e.id}">
          ${e.firstName} ${e.lastName} (${e.email})
        </option>
      `).join('');

    // Nếu đang xem theo 1 nhân viên → tự động chọn sẵn
    if (currentEmployeeId) {
      select.value = currentEmployeeId;
      select.disabled = true; // ngăn đổi khi đang lọc theo 1 người
    }

  } catch (err) {
    console.error(err);
  }
}

// =============================================
// SỬA HỢP ĐỒNG
// =============================================
async function editContract(id) {
  try {
    const res = await fetch(`${API_BASE}/contracts/${id}`, {
      headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
    });
    if (!res.ok) throw new Error("Không tìm thấy hợp đồng");

    const c = await res.json();

    document.getElementById('contractId').value = c.id;
    document.getElementById('employeeId').value = c.employee?.id || '';
    document.getElementById('employeeSelect').value = c.employee?.id || '';
    document.getElementById('employeeSelect').disabled = !!currentEmployeeId; // khóa nếu lọc theo nv
    document.getElementById('contractType').value = c.contractType || 'FULL_TIME';
    document.getElementById('salary').value = c.salary || '';
    document.getElementById('startDate').value = c.startDate || '';
    document.getElementById('endDate').value = c.endDate || '';

    document.querySelector('#contractModal .modal-title').textContent = 'Sửa hợp đồng';
    new bootstrap.Modal(document.getElementById('contractModal')).show();

  } catch (err) {
    alert('Không thể mở thông tin hợp đồng: ' + err.message);
  }
}

// =============================================
// SUBMIT FORM
// =============================================
document.getElementById('contractForm').addEventListener('submit', async e => {
  e.preventDefault();
  const id = document.getElementById('contractId').value;
  const method = id ? 'PUT' : 'POST';
  const url = id ? `${API_BASE}/contracts/${id}` : `${API_BASE}/contracts`;

  const data = {
    contractType: document.getElementById('contractType').value,
    salary: parseFloat(document.getElementById('salary').value) || 0,
    startDate: document.getElementById('startDate').value,
    endDate: document.getElementById('endDate').value || null,
    employee: { id: parseInt(document.getElementById('employeeSelect').value) }
  };

  try {
    const res = await fetch(url, {
      method,
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${localStorage.getItem('token')}`
      },
      body: JSON.stringify(data)
    });

    if (!res.ok) throw new Error('Lưu thất bại');

    bootstrap.Modal.getInstance(document.getElementById('contractModal')).hide();
    loadContracts();
    alert('Lưu hợp đồng thành công!');

  } catch (err) {
    alert('Lỗi khi lưu: ' + err.message);
  }
});

// =============================================
// XÓA HỢP ĐỒNG
// =============================================
async function deleteContract(id) {
  if (!confirm('Xác nhận xóa hợp đồng này?')) return;
  try {
    const res = await fetch(`${API_BASE}/contracts/${id}`, {
      method: 'DELETE',
      headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
    });
    if (res.ok) {
      loadContracts();
      alert('Đã xóa hợp đồng');
    } else {
      alert('Xóa thất bại!');
    }
  } catch (err) {
    alert('Lỗi: ' + err.message);
  }
}

// =============================================
// FILTER CLIENT-SIDE (cơ bản)
// =============================================
function filterTable() {
  const search = document.getElementById('searchInput').value.toLowerCase().trim();
  const type = document.getElementById('typeFilter').value;

  const filtered = allContracts.filter(c => {
    const text = [
      c.employee?.firstName || '',
      c.employee?.lastName || '',
      c.contractType || '',
      c.salary?.toString() || ''
    ].join(' ').toLowerCase();

    return text.includes(search) &&
           (!type || c.contractType === type);
  });

  renderContracts(filtered);
}

// =============================================
// KHỞI TẠO
// =============================================
document.addEventListener('DOMContentLoaded', () => {
  loadContracts();
  loadEmployeesForSelect();

  document.getElementById('searchInput').addEventListener('input', filterTable);
  document.getElementById('typeFilter').addEventListener('change', filterTable);
  document.getElementById('resetFilter').onclick = () => {
    document.getElementById('searchInput').value = '';
    document.getElementById('typeFilter').value = '';
    filterTable();
  };
});
</script>
</body>
</html>
