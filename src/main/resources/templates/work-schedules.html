<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Lịch làm việc nhân viên</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Material Icons -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

  <!-- STYLE -->
  <style>
    body {
      background: #f4f6f9;
      font-family: 'Segoe UI', Tahoma, sans-serif;
    }


    .card {
      border-radius: 14px;
      border: none;
      box-shadow: 0 10px 35px rgba(0,0,0,.08);
    }


    .table th {
      background: #343a40;
      color: #fff;
      font-weight: 600;
    }

    .btn-primary {
      background: linear-gradient(135deg,#11998e,#38ef7d);
      border: none;
    }

    .btn-primary:hover {
      transform: translateY(-1px);
    }

    .badge {
      font-size: .8rem;
      padding: .45em .6em;
      border-radius: 8px;
    }

    .modal-content {
      border-radius: 16px;
      border: none;
      box-shadow: 0 20px 40px rgba(0,0,0,.2);
    }
    .container {
  max-width: 1400px;
}

/* ===== HERO (MATCH EMPLOYEE LIST) ===== */
.list-hero {
  background: linear-gradient(135deg, #1E3C72, #2A5298);
  border-radius: 20px;
  padding: 28px;
  color: #fff;
  box-shadow: 0 25px 60px rgba(30, 60, 114, 0.35);
  margin: 1.5rem 0 2rem;
}

.list-hero h1 {
  font-weight: 700;
  margin-bottom: 6px;
}

.list-hero p {
  opacity: 0.85;
  margin-bottom: 0;
}

/* ===== CARD + TABLE ===== */
.card {
  background: #fff;
  border-radius: 18px;
  box-shadow: 0 15px 40px rgba(15, 23, 42, 0.08);
  border: none;
}

.table th {
  background: #f1f3f5;
  font-weight: 600;
  color: #0f172a;
}

.table tr:hover {
  background: #f8f9fa;
}

/* ===== BADGE ===== */
.badge {
  padding: 6px 10px;
  font-size: 0.75rem;
  border-radius: 8px;
}

/* ===== BUTTON ===== */
.btn {
  border-radius: 10px;
}

  </style>
</head>

<body>
          <div th:replace="Navbar :: navbar"></div>

          <div class="toast-container position-fixed top-0 end-0 p-3"></div>

<div class="container my-4">

  <!-- HEADER -->
  <div class="list-hero d-flex justify-content-between align-items-center flex-wrap gap-3">
  <div>
    <h1 id="employeeName">Lịch làm việc</h1>
    <p>Quản lý, theo dõi và phân ca làm việc cho nhân viên</p>
  </div>

  <div class="d-flex gap-2">
    <a href="/employees" class="btn btn-light d-inline-flex align-items-center">
      <span class="material-icons me-1">arrow_back</span>
      Quay lại
    </a>

    <button id="btnAdd"
            class="btn btn-warning d-inline-flex align-items-center"
            onclick="openAddModal()">
      <span class="material-icons me-1">add</span>
      Thêm ca
    </button>
  </div>
</div>


<!-- SEARCH BAR -->
<div class="card p-3 mb-3">
  <div class="row g-3 align-items-end">
    <div class="col-md-5">
      <label class="form-label fw-semibold">Tên nhân viên</label>
      <input type="text" id="searchName" class="form-control"
             placeholder="Nhập tên nhân viên...">
    </div>

    <div class="col-md-4">
      <label class="form-label fw-semibold">Phòng ban</label>
      <select id="searchDepartment" class="form-select">
        <option value="">-- Tất cả phòng ban --</option>
      </select>
    </div>

    <div class="col-md-3 d-flex gap-2">
      <button class="btn btn-primary w-100" onclick="applyFilter()">
        <span class="material-icons me-1">search</span>
        Tìm kiếm
      </button>
      <button class="btn btn-light w-100" onclick="resetFilter()">
        Reset
      </button>
    </div>
  </div>
</div>

  <!-- TABLE -->
  <div class="card p-3">
    <div class="table-responsive">
      <table class="table table-bordered table-hover align-middle shadow-sm mb-0">
        <tr>
  <th>Nhân viên</th>
  <th>Ngày</th>
  <th>Ca</th>
  <th>Bắt đầu</th>
  <th>Kết thúc</th>
  <th width="120">Thao tác</th>
</tr>

        <tbody id="scheduleBody">
          <tr>
            <td colspan="6" class="text-center text-muted">Đang tải dữ liệu...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</div>

<!-- MODAL -->
<div class="modal fade" id="scheduleModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalTitle">Thêm ca làm</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        <input type="hidden" id="scheduleId">

        <div class="mb-3" id="employeeSelectWrapper">
          <label class="form-label fw-semibold">Nhân viên</label>
          <select id="employeeSelect" class="form-select">
          <option value="">-- Chọn nhân viên --</option>
          </select>
      </div>

        <div class="mb-3">
          <label class="form-label fw-semibold">Ngày làm</label>
          <input type="date" id="workDate" class="form-control" required>
        </div>

        <div class="row">
          <div class="col mb-3">
            <label class="form-label fw-semibold">Giờ bắt đầu</label>
            <input type="time" id="startTime" class="form-control" required>
          </div>
          <div class="col mb-3">
            <label class="form-label fw-semibold">Giờ kết thúc</label>
            <input type="time" id="endTime" class="form-control" required>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold">Ca</label>
          <select id="shift" class="form-select">
            <option value="Morning">Sáng</option>
            <option value="Afternoon">Chiều</option>
            <option value="Night">Tối</option>
            <option value="Full">Cả ngày</option>
          </select>
        </div>
      </div>

      <div class="modal-footer border-0">
        <button class="btn btn-light px-4" data-bs-dismiss="modal">Hủy</button>
        <button class="btn btn-primary px-4" onclick="saveSchedule()">Lưu</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  
<script>
const API = '/api';

function authFetch(url, options = {}) {
  return fetch(url, {
    ...options,
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + localStorage.getItem('token')
    }
  }).then(res => {
    if (!res.ok && res.status === 403) {
      alert('Bạn không có quyền thực hiện hành động này.');
      throw new Error('Forbidden');
    }
    return res;
  });
}

function showToast(msg, type = 'success') {
  const toast = document.createElement('div');
  toast.className = `toast align-items-center text-bg-${type} border-0`;
  toast.innerHTML = `
    <div class="d-flex">
      <div class="toast-body">${msg}</div>
      <button type="button"
              class="btn-close btn-close-white me-2 m-auto"
              data-bs-dismiss="toast"></button>
    </div>
  `;
  document.querySelector('.toast-container').appendChild(toast);
  new bootstrap.Toast(toast, { delay: 3500 }).show();
}


let currentUser = null;

async function loadCurrentUser() {
  const res = await authFetch('/api/auth/me');
  if (!res.ok) throw new Error('Không lấy được thông tin user');
  currentUser = await res.json();
}

function isAllowedToManage() {
  return currentUser.role === 'ADMIN' || currentUser.role === 'DEPARTMENT';
  // Nếu role trưởng phòng là DEPARTMENT_HEAD thì thay thành:
  // return currentUser.role === 'ADMIN' || currentUser.role === 'DEPARTMENT_HEAD';
}

function getEmployeeIdFromUrl() {
  return new URLSearchParams(window.location.search).get('employeeId');
}

function applyRoleUI() {
  const canManage = isAllowedToManage();

  // Ẩn nút Thêm nếu không có quyền
  document.getElementById('btnAdd').style.display = canManage ? 'inline-block' : 'none';

  // Nếu là EMPLOYEE → ẩn luôn cột Thao tác (sửa/xóa)
  if (currentUser.role === 'EMPLOYEE') {
    document.querySelector('table th:last-child').style.display = 'none';
      document.getElementById('searchDepartment')
    .closest('.col-md-4').style.display = 'none';
  }
}

async function loadEmployeesForSelect() {
  const res = await authFetch('/api/employees');
  const data = await res.json();

  const select = document.getElementById('employeeSelect');
  select.innerHTML = '<option value="">-- Chọn nhân viên --</option>';

  data.forEach(e => {
    const opt = document.createElement('option');
    opt.value = e.id;
    opt.textContent = `${e.firstName} ${e.lastName}`;
    select.appendChild(opt);
  });
}

async function loadData() {
  try {
    await loadCurrentUser();
    applyRoleUI();

    await loadDepartments();
   let employeeId = getEmployeeIdFromUrl();
let schedules = [];
let title = 'Lịch làm việc';

// 👉 Nếu là EMPLOYEE → tự động xem lịch của chính mình
if (currentUser.role === 'EMPLOYEE') {
  employeeId = currentUser.id; // user.id === employee.id
}

// 👉 Nếu vẫn không có employeeId
if (!employeeId) {
  // Chỉ ADMIN / DEPARTMENT mới được xem tất cả
  if (!isAllowedToManage()) {
    alert('Bạn không có quyền xem lịch này');
    window.location.href = '/employees';
    return;
  }

  const res = await authFetch(`${API}/workschedules`);
  schedules = await res.json();
  title = 'Tất cả ca làm việc';
} else {
  const empRes = await authFetch(`${API}/employees/${employeeId}`);
  const emp = await empRes.json();

  title = `Lịch làm việc: ${emp.firstName} ${emp.lastName}`;

  const schedRes = await authFetch(`${API}/workschedules/employee/${employeeId}`);
  schedules = await schedRes.json();
}


document.getElementById('employeeName').textContent = title;

// ✅ LƯU DATA GỐC
originalData = schedules;

// ✅ RENDER TABLE
renderTable(schedules);

  } catch (err) {
    console.error(err);
    document.getElementById('scheduleBody').innerHTML = 
      `<tr><td colspan="6" class="text-center text-danger">Lỗi tải dữ liệu</td></tr>`;
  }
}

let originalData = [];

function renderTable(data) {
  const body = document.getElementById('scheduleBody');
  const canManage = isAllowedToManage();

  if (!data || data.length === 0) {
    body.innerHTML = `
      <tr>
        <td colspan="6" class="text-center text-muted">Chưa có ca làm</td>
      </tr>`;
    return;
  }

  body.innerHTML = data.map(s => `
    <tr>
      <td class="fw-semibold">
        ${s.employee
          ? `${s.employee.firstName} ${s.employee.lastName}`
          : '<span class="text-muted">—</span>'}
      </td>

      <td class="fw-semibold text-primary">${s.workDate}</td>

      <td>
        ${
          s.shift === 'Morning'
            ? '<span class="badge bg-warning">Sáng</span>'
            : s.shift === 'Afternoon'
            ? '<span class="badge bg-info">Chiều</span>'
            : s.shift === 'Night'
            ? '<span class="badge bg-dark">Tối</span>'
            : '<span class="badge bg-success">Cả ngày</span>'
        }
      </td>

      <td>${s.startTime?.substring(0,5) || '—'}</td>
      <td>${s.endTime?.substring(0,5) || '—'}</td>

      <td>
  ${canManage ? `
    <button class="btn btn-sm btn-outline-primary me-1"
      onclick='openEditModal(${JSON.stringify(s)})'>
      Sửa
    </button>
    <button class="btn btn-sm btn-outline-danger"
      onclick="deleteSchedule(${s.id})">
      Xóa
    </button>
  ` : `<span class="text-muted">—</span>`}
</td>

    </tr>
  `).join('');
}


function openAddModal() {
  if (!isAllowedToManage()) return;

  document.getElementById('scheduleId').value = '';
  document.getElementById('modalTitle').textContent = 'Thêm ca làm';

  // Hiện select nhân viên
  document.getElementById('employeeSelectWrapper').style.display = 'block';
  loadEmployeesForSelect();

  // Reset form
  document.getElementById('employeeSelect').value = '';
  document.getElementById('workDate').value = '';
  document.getElementById('startTime').value = '';
  document.getElementById('endTime').value = '';
  document.getElementById('shift').value = 'Morning';

  new bootstrap.Modal(document.getElementById('scheduleModal')).show();
}

function openEditModal(s) {
  if (!isAllowedToManage()) return;

  document.getElementById('scheduleId').value = s.id;
  document.getElementById('modalTitle').textContent = 'Sửa ca làm';

  // Ẩn chọn nhân viên
  document.getElementById('employeeSelectWrapper').style.display = 'none';

  document.getElementById('workDate').value = s.workDate;
  document.getElementById('startTime').value = s.startTime?.substring(0,5) || '';
  document.getElementById('endTime').value   = s.endTime?.substring(0,5)   || '';
  document.getElementById('shift').value = s.shift;

  new bootstrap.Modal(document.getElementById('scheduleModal')).show();
}

async function saveSchedule() {
  if (!isAllowedToManage()) {
    alert('Bạn không có quyền lưu ca làm');
    return;
  }

  // ✅ KHAI BÁO id ĐÚNG CHỖ
  const id = document.getElementById('scheduleId').value;

  let employeeId = getEmployeeIdFromUrl();

  // 👉 Nếu không có employeeId trên URL → lấy từ select
  if (!employeeId) {
    employeeId = document.getElementById('employeeSelect').value;
    if (!employeeId) {
      alert('Vui lòng chọn nhân viên');
      return;
    }
  }

  const payload = {
    workDate: document.getElementById('workDate').value,
    startTime: document.getElementById('startTime').value + ':00',
    endTime: document.getElementById('endTime').value + ':00',
    shift: document.getElementById('shift').value,
    employee: {
      id: Number(employeeId)
    }
  };

  const url = id
    ? `${API}/workschedules/${id}`
    : `${API}/workschedules`;

  const method = id ? 'PUT' : 'POST';

  try {
    const res = await authFetch(url, {
      method,
      body: JSON.stringify(payload)
    });

    if (!res.ok) throw new Error('Lỗi server');

bootstrap.Modal
  .getInstance(document.getElementById('scheduleModal'))
  .hide();

showToast(
  id ? 'Cập nhật ca làm thành công!' : 'Thêm ca làm thành công!',
  'success'
);

loadData();
  } catch (err) {
    console.error(err);
    alert('Không thể lưu ca làm. Vui lòng kiểm tra lại.');
  }
}

async function deleteSchedule(id) {
  if (!isAllowedToManage()) return;
  if (!confirm('Xác nhận xóa ca làm?')) return;

  try {
    await authFetch(`${API}/workschedules/${id}`, { method: 'DELETE' });

    showToast('Xóa ca làm thành công!', 'success');

    loadData();

  } catch (err) {
    alert('Không thể xóa ca làm');
  }
}
function applyFilter() {
  const name = document.getElementById('searchName').value.toLowerCase();
  const dept = document.getElementById('searchDepartment').value;

  const filtered = originalData.filter(s => {
    const fullName = s.employee
      ? `${s.employee.firstName} ${s.employee.lastName}`.toLowerCase()
      : '';

    const matchName = !name || fullName.includes(name);
    const matchDept = !dept || s.employee?.department?.id == dept;

    return matchName && matchDept;
  });

  renderTable(filtered);
}


function resetFilter() {
  document.getElementById('searchName').value = '';
  document.getElementById('searchDepartment').value = '';
  renderTable(originalData);
}

let departmentsLoaded = false;

async function loadDepartments() {
  if (departmentsLoaded) return;
  departmentsLoaded = true;

  const res = await authFetch('/api/departments');
  const data = await res.json();

  const select = document.getElementById('searchDepartment');
  data.forEach(d => {
    const opt = document.createElement('option');
    opt.value = d.id;
    opt.textContent = d.name;
    select.appendChild(opt);
  });
}




// Khởi động
loadData();
</script>
</body>
</html>
