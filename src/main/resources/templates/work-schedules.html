<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Lịch làm việc nhân viên</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Material Icons -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

  <!-- STYLE -->
  <style>
    body {
      background: #f4f6f9;
      font-family: 'Segoe UI', Tahoma, sans-serif;
    }

    .header-gradient {
      background: linear-gradient(135deg, #11998e, #38ef7d);
      color: #fff;
      border-radius: 14px;
      padding: 2rem;
      margin-bottom: 2rem;
    }

    .card {
      border-radius: 14px;
      border: none;
      box-shadow: 0 10px 35px rgba(0,0,0,.08);
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }

    .top-bar h1 {
      font-size: 2rem;
      font-weight: 600;
      margin: 0;
    }

    .subtitle {
      color: #6c757d;
    }

    .table th {
      background: #343a40;
      color: #fff;
      font-weight: 600;
    }

    .btn-primary {
      background: linear-gradient(135deg,#11998e,#38ef7d);
      border: none;
    }

    .btn-primary:hover {
      transform: translateY(-1px);
    }

    .badge {
      font-size: .8rem;
      padding: .45em .6em;
      border-radius: 8px;
    }

    .modal-content {
      border-radius: 16px;
      border: none;
      box-shadow: 0 20px 40px rgba(0,0,0,.2);
    }
  </style>
</head>

<body>
          <div th:replace="Navbar :: navbar"></div>

<div class="container my-4">

  <!-- HEADER -->
  <div class="header-gradient">
    <h4>📅 Lịch làm việc</h4>
    <p class="mb-0">Quản lý lịch làm việc theo từng nhân viên</p>
  </div>

  <!-- TOP BAR -->
  <div class="top-bar">
    <div>
      <h1 id="employeeName">Lịch làm việc</h1>
      <div class="subtitle">Danh sách ca làm của nhân viên</div>
    </div>
    <div>
      <a href="/employees" class="btn btn-outline-secondary me-2">← Quay lại</a>
      <button id="btnAdd"
        class="btn btn-primary px-4"
        onclick="openAddModal()">
  <span class="material-icons align-middle">add</span> Thêm ca
</button>

    </div>
  </div>

  <!-- TABLE -->
  <div class="card p-3">
    <div class="table-responsive">
      <table class="table table-bordered table-hover align-middle shadow-sm mb-0">
        <thead>
          <tr>
            <th>Ngày</th>
            <th>Ca</th>
            <th>Bắt đầu</th>
            <th>Kết thúc</th>
            <th width="120">Thao tác</th>
          </tr>
        </thead>
        <tbody id="scheduleBody">
          <tr>
            <td colspan="5" class="text-center text-muted">Đang tải dữ liệu...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</div>

<!-- MODAL -->
<div class="modal fade" id="scheduleModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalTitle">Thêm ca làm</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        <input type="hidden" id="scheduleId">

        <div class="mb-3">
          <label class="form-label fw-semibold">Ngày làm</label>
          <input type="date" id="workDate" class="form-control" required>
        </div>

        <div class="row">
          <div class="col mb-3">
            <label class="form-label fw-semibold">Giờ bắt đầu</label>
            <input type="time" id="startTime" class="form-control" required>
          </div>
          <div class="col mb-3">
            <label class="form-label fw-semibold">Giờ kết thúc</label>
            <input type="time" id="endTime" class="form-control" required>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold">Ca</label>
          <select id="shift" class="form-select">
            <option value="Morning">Sáng</option>
            <option value="Afternoon">Chiều</option>
            <option value="Night">Tối</option>
            <option value="Full">Cả ngày</option>
          </select>
        </div>
      </div>

      <div class="modal-footer border-0">
        <button class="btn btn-light px-4" data-bs-dismiss="modal">Hủy</button>
        <button class="btn btn-primary px-4" onclick="saveSchedule()">Lưu</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  
<script>
const API = '/api';

function authFetch(url, options = {}) {
  return fetch(url, {
    ...options,
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + localStorage.getItem('token')
    }
  }).then(res => {
    if (!res.ok && res.status === 403) {
      alert('Bạn không có quyền thực hiện hành động này.');
      throw new Error('Forbidden');
    }
    return res;
  });
}

let currentUser = null;

async function loadCurrentUser() {
  const res = await authFetch('/api/auth/me');
  if (!res.ok) throw new Error('Không lấy được thông tin user');
  currentUser = await res.json();
}

function isAllowedToManage() {
  return currentUser.role === 'ADMIN' || currentUser.role === 'DEPARTMENT';
  // Nếu role trưởng phòng là DEPARTMENT_HEAD thì thay thành:
  // return currentUser.role === 'ADMIN' || currentUser.role === 'DEPARTMENT_HEAD';
}

function getEmployeeIdFromUrl() {
  return new URLSearchParams(window.location.search).get('employeeId');
}

function applyRoleUI() {
  const canManage = isAllowedToManage();

  // Ẩn nút Thêm nếu không có quyền
  document.getElementById('btnAdd').style.display = canManage ? 'inline-block' : 'none';

  // Nếu là EMPLOYEE → ẩn luôn cột Thao tác (sửa/xóa)
  if (currentUser.role === 'EMPLOYEE') {
    document.querySelector('table th:last-child').style.display = 'none';
  }
}

async function loadData() {
  try {
    await loadCurrentUser();
    applyRoleUI();

   let employeeId = getEmployeeIdFromUrl();
let schedules = [];
let title = 'Lịch làm việc';

// 👉 Nếu là EMPLOYEE → tự động xem lịch của chính mình
if (currentUser.role === 'EMPLOYEE') {
  employeeId = currentUser.id; // user.id === employee.id
}

// 👉 Nếu vẫn không có employeeId
if (!employeeId) {
  // Chỉ ADMIN / DEPARTMENT mới được xem tất cả
  if (!isAllowedToManage()) {
    alert('Bạn không có quyền xem lịch này');
    window.location.href = '/employees';
    return;
  }

  const res = await authFetch(`${API}/workschedules`);
  schedules = await res.json();
  title = 'Tất cả ca làm việc';
} else {
  const empRes = await authFetch(`${API}/employees/${employeeId}`);
  const emp = await empRes.json();

  title = `Lịch làm việc: ${emp.firstName} ${emp.lastName}`;

  const schedRes = await authFetch(`${API}/workschedules/employee/${employeeId}`);
  schedules = await schedRes.json();
}


    document.getElementById('employeeName').textContent = title;
    renderTable(schedules);
  } catch (err) {
    console.error(err);
    document.getElementById('scheduleBody').innerHTML = 
      `<tr><td colspan="5" class="text-center text-danger">Lỗi tải dữ liệu</td></tr>`;
  }
}

function renderTable(data) {
  const body = document.getElementById('scheduleBody');
  const canManage = isAllowedToManage();

  if (!data || data.length === 0) {
    body.innerHTML = `<tr><td colspan="5" class="text-center text-muted">Chưa có ca làm</td></tr>`;
    return;
  }

  body.innerHTML = data.map(s => `
    <tr>
      <td class="fw-semibold text-primary">${s.workDate}</td>
      <td><span class="badge bg-info">${s.shift}</span></td>
      <td>${s.startTime?.substring(0,5) || '—'}</td>
      <td>${s.endTime?.substring(0,5) || '—'}</td>
      <td>
        ${canManage ? `
          <button class="btn btn-sm btn-outline-primary me-1"
            onclick='openEditModal(${JSON.stringify(s)})'>
            <span class="material-icons" style="font-size:16px">edit</span>
          </button>
          <button class="btn btn-sm btn-outline-danger"
            onclick="deleteSchedule(${s.id})">
            <span class="material-icons" style="font-size:16px">delete</span>
          </button>
        ` : `<span class="text-muted">—</span>`}
      </td>
    </tr>
  `).join('');
}

function openAddModal() {
  if (!isAllowedToManage()) return;

  document.getElementById('scheduleId').value = '';
  document.getElementById('modalTitle').textContent = 'Thêm ca làm';
  
  // Reset form
  document.getElementById('workDate').value = '';
  document.getElementById('startTime').value = '';
  document.getElementById('endTime').value = '';
  document.getElementById('shift').value = 'Morning';

  new bootstrap.Modal(document.getElementById('scheduleModal')).show();
}

function openEditModal(s) {
  if (!isAllowedToManage()) return;

  document.getElementById('scheduleId').value = s.id;
  document.getElementById('modalTitle').textContent = 'Sửa ca làm';

  document.getElementById('workDate').value = s.workDate;
  document.getElementById('startTime').value = s.startTime?.substring(0,5) || '';
  document.getElementById('endTime').value   = s.endTime?.substring(0,5)   || '';
  document.getElementById('shift').value = s.shift;

  new bootstrap.Modal(document.getElementById('scheduleModal')).show();
}

async function saveSchedule() {
  if (!isAllowedToManage()) return alert('Bạn không có quyền lưu ca làm');

  const id = document.getElementById('scheduleId').value;
  const employeeId = getEmployeeIdFromUrl();

  // Nếu đang xem tất cả (không có employeeId) → bắt buộc phải chọn nhân viên (cần thêm select trong modal)
  if (!employeeId) {
    alert('Vui lòng chọn nhân viên trước khi thêm ca (trang này chưa hỗ trợ)');
    return;
  }

  const payload = {
    workDate: document.getElementById('workDate').value,
    startTime: document.getElementById('startTime').value + ':00',
    endTime:   document.getElementById('endTime').value   + ':00',
    shift:     document.getElementById('shift').value,
    employee:  { id: Number(employeeId) }
  };

  const url = id ? `${API}/workschedules/${id}` : `${API}/workschedules`;
  const method = id ? 'PUT' : 'POST';

  try {
    const res = await authFetch(url, {
      method,
      body: JSON.stringify(payload)
    });

    if (!res.ok) throw new Error('Lỗi server');

    bootstrap.Modal.getInstance(document.getElementById('scheduleModal')).hide();
    loadData();
  } catch (err) {
    alert('Không thể lưu ca làm. Vui lòng kiểm tra lại.');
  }
}

async function deleteSchedule(id) {
  if (!isAllowedToManage()) return;
  if (!confirm('Xác nhận xóa ca làm?')) return;

  try {
    await authFetch(`${API}/workschedules/${id}`, { method: 'DELETE' });
    loadData();
  } catch (err) {
    alert('Không thể xóa ca làm');
  }
}

// Khởi động
loadData();
</script>
</body>
</html>
