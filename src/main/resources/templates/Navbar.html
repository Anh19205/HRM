<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="navbar">

<style>
* {
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  margin: 0;
}

/* NAVBAR */
.navbar {
  background: linear-gradient(135deg, #1E3C72 0%, #2A5298 100%);
  padding: 0.6rem 1.2rem;
  display: flex;
  align-items: center;
  color: white;
  box-shadow: 0 4px 20px rgba(0,0,0,0.15);
}

.brand {
  font-size: 1.4rem;
  font-weight: 600;
  color: white;
  text-decoration: none;
  flex-grow: 1;
}

/* MENU */
.menu {
  display: flex;
  gap: 1rem;
  align-items: center;
}

.menu a,
.menu button {
  background: none;
  border: none;
  color: white;
  font-size: 1rem;
  font-weight: 500;
  cursor: pointer;
  text-decoration: none;
}

.menu a.active {
  color: #ff9800;
}

.logout {
  color: red;
}

/* MOBILE */
.menu-icon {
  display: none;
  font-size: 1.8rem;
  cursor: pointer;
}

/* DRAWER */
.drawer {
  position: fixed;
  top: 0;
  left: -260px;
  width: 250px;
  height: 100%;
  background-color: #3f51b5;
  padding-top: 1rem;
  transition: left 0.3s ease;
  z-index: 1000;
}

.drawer.open {
  left: 0;
}

.drawer a {
  display: block;
  padding: 0.75rem 1rem;
  color: white;
  text-decoration: none;
}

.drawer a.active {
  color: #ff9800;
}

.drawer a.logout {
  color: red;
}

/* OVERLAY */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.4);
  display: none;
  z-index: 999;
}

.overlay.show {
  display: block;
}

/* RESPONSIVE */
@media (max-width: 1000px) {
  .menu {
    display: none;
  }
  .menu-icon {
    display: block;
  }
}
</style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
  <a href="/" class="brand">Employee Management System</a>

  <div class="menu-icon" onclick="toggleDrawer()">☰</div>

  <div class="menu" id="desktopMenu"></div>
</div>

<!-- DRAWER -->
<div class="drawer" id="drawer"></div>
<div class="overlay" id="overlay" onclick="toggleDrawer()"></div>

<script>
const routes = [
  { path: '/', label: 'Home' },
  { path: '/dashboard', label: 'Dashboard' },
  { path: '/employees', label: 'Employees' },
  { path: '/departments', label: 'Departments' },
  { path: '/schedule', label: 'Work Schedules' },
  { path: '/profile', label: 'Profile' },
];

const currentPath = window.location.pathname;
const token = localStorage.getItem('token');
const isLoggedIn = !!token;

const desktopMenu = document.getElementById('desktopMenu');
const drawer = document.getElementById('drawer');

function isActive(path) {
  return currentPath === path;
}

function buildMenu(container, isDrawer = false) {
  container.innerHTML = '';

  routes.forEach(r => {
    const link = document.createElement('a');
    link.href = r.path;
    link.textContent = r.label;
    if (isActive(r.path)) link.classList.add('active');
    link.onclick = isDrawer ? toggleDrawer : null;
    container.appendChild(link);
  });

  if (isLoggedIn) {
    const logout = document.createElement(isDrawer ? 'a' : 'button');
    logout.textContent = 'Logout';
    logout.className = 'logout';
    logout.onclick = handleLogout;
    container.appendChild(logout);
  } else {
    const login = document.createElement('a');
    login.href = '/login';
    login.textContent = 'Login';
    if (isActive('/login')) login.classList.add('active');
    container.appendChild(login);
  }

  const register = document.createElement('a');
  register.href = '/register';
  register.textContent = 'Register';
  if (isActive('/register')) register.classList.add('active');
  container.appendChild(register);
}

buildMenu(desktopMenu);
buildMenu(drawer, true);

function toggleDrawer() {
  drawer.classList.toggle('open');
  document.getElementById('overlay').classList.toggle('show');
}

function handleLogout() {
  localStorage.removeItem('token');
  localStorage.removeItem('EMSusername');
  window.location.href = '/';
}
</script>

</body>
</html>
