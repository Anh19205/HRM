<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập | Quản lý Nhân viên</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #1E3C72 0%, #2A5298 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      font-family: 'Poppins', sans-serif;
      color: #333;
    }

    .card {
      width: 100%;
      max-width: 900px;
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      background: white;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    }

    @media (max-width: 768px) {
      .card { grid-template-columns: 1fr; }
    }

    .left {
      background: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
      padding: 3.5rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 1.5rem;
      color: #1a1a1a;
    }

    .left h1 { font-size: 2.4rem; font-weight: 700; margin: 0; }
    .left p { font-size: 1.1rem; margin: 0; }

    .right {
      padding: 3rem;
      background: white;
    }

    .right h2 {
      text-align: center;
      margin-bottom: 2rem;
      color: #1976d2;
      font-weight: 700;
    }

    .form-group { margin-bottom: 1.5rem; position: relative; }
    .form-label { font-weight: 600; color: #495057; margin-bottom: 0.4rem; display: block; }

    .form-control {
      padding: 0.75rem 1rem;
      border-radius: 8px;
      border: 1px solid #ced4da;
      transition: border-color 0.2s;
    }

    .form-control:focus {
      border-color: #1976d2;
      box-shadow: 0 0 0 0.25rem rgba(25,118,210,0.15);
    }

    .password-toggle {
      position: absolute;
      right: 1rem;
      top: 2.4rem;
      background: none;
      border: none;
      color: #6c757d;
      cursor: pointer;
      font-size: 1.3rem;
    }

    .btn-login {
      width: 100%;
      padding: 0.85rem;
      background: #1976d2;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      transition: background 0.2s;
    }

    .btn-login:hover:not(:disabled) { background: #1565c0; }
    .btn-login:disabled { opacity: 0.6; cursor: not-allowed; }

    .error-message {
      color: #dc3545;
      text-align: center;
      font-size: 0.9rem;
      margin-top: 0.8rem;
      min-height: 1.2rem;
    }

    .links {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.95rem;
    }

    .links a { color: #1976d2; text-decoration: none; font-weight: 600; }
    .links a:hover { text-decoration: underline; }

    .toast-container { position: fixed; top: 20px; right: 20px; z-index: 1050; }
  </style>
</head>
<body>

<div class="card">
  <!-- LEFT -->
  <div class="left">
    <h1>Chào mừng trở lại!</h1>
    <p>Đăng nhập để quản lý nhân viên, phòng ban và dashboard một cách dễ dàng.</p>
    <ul style="margin: 0; padding-left: 1.2rem; font-size: 0.95rem;">
      <li>Truy cập an toàn với JWT</li>
      <li>Quản lý tập trung</li>
      <li>Tiếp tục công việc ngay lập tức</li>
    </ul>
  </div>

  <!-- RIGHT -->
  <div class="right">
    <h2>Đăng nhập</h2>

    <form id="loginForm" novalidate>
      <div class="form-group">
        <label for="username" class="form-label">Tên đăng nhập</label>
        <input type="text" class="form-control" id="username" required minlength="3">
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Mật khẩu</label>
        <input type="password" class="form-control" id="password" required minlength="6">
        <button type="button" class="password-toggle material-icons" id="togglePassword">visibility</button>
      </div>

      <button type="submit" class="btn-login" id="submitBtn">Đăng nhập</button>

      <div class="error-message" id="errorMessage"></div>
    </form>

  </div>
</div>

<!-- Toast container -->
<div class="toast-container"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
  const API_BASE = 'http://localhost:8080';
  const LOGIN_ENDPOINT = '/api/auth/authenticate';


  const form = document.getElementById('loginForm');
  const errorMessage = document.getElementById('errorMessage');
  const submitBtn = document.getElementById('submitBtn');
  const toggleBtn = document.getElementById('togglePassword');

  // Toggle password
  toggleBtn.addEventListener('click', () => {
    const input = document.getElementById('password');
    input.type = input.type === 'password' ? 'text' : 'password';
    toggleBtn.textContent = input.type === 'password' ? 'visibility' : 'visibility_off';
  });

  // Toast helper
  function showToast(message, type = 'success') {
    const toast = document.createElement('div');
    toast.className = `toast align-items-center text-bg-${type} border-0`;
    toast.innerHTML = `
      <div class="d-flex">
        <div class="toast-body">${message}</div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
      </div>
    `;
    document.querySelector('.toast-container').appendChild(toast);
    new bootstrap.Toast(toast, { autohide: true, delay: 4000 }).show();
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorMessage.textContent = '';

    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;

    if (!username || username.length < 3) {
      errorMessage.textContent = 'Tên đăng nhập phải từ 3 ký tự trở lên.';
      return;
    }
    if (!password || password.length < 6) {
      errorMessage.textContent = 'Mật khẩu phải từ 6 ký tự trở lên.';
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Đang đăng nhập...';

    try {
      const res = await fetch(`${API_BASE}${LOGIN_ENDPOINT}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });

      const data = await res.json();

      if (!res.ok) {
        throw new Error(data.message || 'Tài khoản hoặc mật khẩu không đúng.');
      }

      localStorage.setItem('token', data.token);
      localStorage.setItem('EMSusername', username);
      localStorage.setItem("role", data.role);

showToast(`Chào mừng trở lại, ${username}!`, 'success');

setTimeout(() => {
  if (data.role === 'ADMIN') {
    window.location.href = '/Admin';
  } else {
    window.location.href =
      new URLSearchParams(window.location.search).get('from') || '/';
  }
}, 1200);


//showToast(`Chào mừng trở lại, ${username}!`, 'success');

  if (role === 'ADMIN') {
    window.location.href = '/Admin';
  } else {
    // giữ nguyên hành vi cũ
    window.location.href =
      new URLSearchParams(window.location.search).get('from') || '/';
  }
}, 1200);

    } catch (err) {
      errorMessage.textContent = err.message || 'Lỗi kết nối server. Vui lòng thử lại.';
      console.error(err);
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Đăng nhập';
    }
  });
</script>
</body>
</html>
