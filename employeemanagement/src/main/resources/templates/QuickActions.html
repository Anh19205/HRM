<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Quick Actions</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      height: 200vh;
    }

    /* Floating Button */
    .speed-dial {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 1500;
    }

    .fab {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: #1976d2;
      color: white;
      font-size: 28px;
      border: none;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(0,0,0,0.25);
      transition: transform 0.2s;
    }

    .fab:hover {
      transform: rotate(90deg);
    }

    /* Action Menu */
    .actions {
      position: absolute;
      bottom: 70px;
      right: 0;
      display: none;
      flex-direction: column;
      gap: 12px;
      align-items: flex-end;
    }

    .actions.show {
      display: flex;
    }

    /* Action Button */
    .action {
      display: flex;
      align-items: center;
      gap: 10px;
      background: white;
      border-radius: 30px;
      padding: 8px 14px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.2);
      cursor: pointer;
      white-space: nowrap;
      transition: transform 0.15s, background 0.15s;
    }

    .action:hover {
      transform: translateX(-4px);
      background: #f0f4ff;
    }

    .icon {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #1976d2;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }

    /* Tooltip */
    .tooltip {
      position: absolute;
      bottom: 90px;
      right: 0;
      background: black;
      color: white;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
    }

    .speed-dial:hover .tooltip {
      opacity: 1;
    }
  </style>
</head>
<body>

  <div class="speed-dial">
    <div class="tooltip">Quick actions</div>

    <div class="actions" id="actions">
      <div class="action" onclick="go('/dashboard.html')">
        <div class="icon">📊</div>
        Dashboard
      </div>
      <div class="action" onclick="go('/add-employee.html')">
        <div class="icon">👤</div>
        Add Employee
      </div>
      <div class="action" onclick="go('/add-department.html')">
        <div class="icon">🏢</div>
        Add Department
      </div>
    </div>

    <button class="fab" onclick="toggleActions()">+</button>
  </div>

  <script>
    function toggleActions() {
      document.getElementById("actions").classList.toggle("show");
    }

    function go(path) {
      window.location.href = path;
    }
  </script>

</body>
</html>
