<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hồ sơ Người dùng</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #f4f6f8; min-height: 100vh; }
    .container { max-width: 1200px; margin: auto; padding: 40px 16px; }
    .grid { display: grid; grid-template-columns: 1fr 2fr; gap: 24px; }
    @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
    .card { background: #fff; border-radius: 16px; box-shadow: 0 20px 55px rgba(15,23,42,0.12); padding: 24px; }
    .center { text-align: center; }
    .avatar { width: 140px; height: 140px; border-radius: 50%; border: 4px solid #1976d2; object-fit: cover; background: #e9ecef; display: flex; align-items: center; justify-content: center; font-size: 3rem; color: #495057; margin: 0 auto 16px; }
    .chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; border-radius: 20px; border: 1px solid #dee2e6; font-size: 14px; margin: 6px; background: #f8f9fa; }
    .btn { width: 100%; padding: 12px; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .btn-danger { background: #dc3545; color: white; border: none; }
    .btn-outline { background: transparent; border: 2px solid #1976d2; color: #1976d2; }
    .btn-outline:hover { background: #1976d2; color: white; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 24px; }
    @media (max-width: 700px) { .stats { grid-template-columns: 1fr; } }
    .stat-box { background: linear-gradient(135deg, #e0e7ff, #f8f9ff); padding: 20px; border-radius: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.06); text-align: center; }
    .stat-value { font-size: 2.5rem; font-weight: 700; color: #1976d2; }
    .divider { height: 1px; background: #dee2e6; margin: 24px 0; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 16px; }
    .loading { height: 100vh; display: flex; justify-content: center; align-items: center; font-size: 1.5rem; color: #6c757d; }
    .snackbar { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #fff3cd; padding: 16px 32px; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.2); z-index: 1050; text-align: center; }
    .toast-container { position: fixed; top: 20px; right: 20px; z-index: 1050; }
  </style>
</head>
<body>

<div id="loading" class="loading">Đang tải hồ sơ...</div>

<div id="snackbar" class="snackbar" style="display:none;">
  Bạn cần đăng nhập để xem hồ sơ.<br>
  <a href="login.html" style="color:#1976d2;">Đăng nhập ngay</a>
</div>

<div id="app" class="container" style="display:none;">
  <div class="grid">

    <!-- LEFT CARD - Profile Info -->
    <div class="card center">
      <div class="avatar" id="avatar">JD</div>
      <h2 id="username">Loading...</h2>
      <div class="chip"><span class="material-icons">verified</span> Đã xác thực</div>
      <div class="chip" id="emailChip">Loading email...</div>
      <div class="divider"></div>
      <button class="btn btn-danger" onclick="logout()">Đăng xuất</button>
    </div>

    <!-- RIGHT CARD - Organization Stats -->
    <div class="card">
      <div class="top-bar">
        <h3>Tổng quan tổ chức</h3>
        <button class="btn btn-outline" onclick="exportCSV()">Export snapshot</button>
      </div>

      <div class="divider"></div>

      <div class="stats">
        <div class="stat-box">
          <div class="stat-value" id="employeeCount">0</div>
          <div>Nhân viên</div>
        </div>
        <div class="stat-box">
          <div class="stat-value" id="departmentCount">0</div>
          <div>Phòng ban</div>
        </div>
        <div class="stat-box">
          <div class="stat-value" id="averageAge">0</div>
          <div>Tuổi trung bình</div>
        </div>
      </div>

      <div class="divider"></div>

      <h4>Tiếp theo là gì?</h4>
      <div>
        <span class="chip clickable" onclick="go('/employee-form')"><span class="material-icons">person_add</span>Thêm nhân viên</span>
        <span class="chip clickable" onclick="go('/department-form')"><span class="material-icons">business</span>Tạo phòng ban</span>
        <span class="chip clickable" onclick="go('/departments')"><span class="material-icons">dashboard</span>Xem dashboard</span>
      </div>
    </div>

  </div>
</div>

<div class="toast-container"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  function authFetch(url, options = {}) {
  const token = localStorage.getItem("token");

  return fetch(url, {
    ...options,
    headers: {
      "Content-Type": "application/json",
      "Authorization": "Bearer " + token,
      ...(options.headers || {})
    }
  });
}

  const API_BASE = '/api';
  const token = localStorage.getItem('token');
  const username = localStorage.getItem('EMSusername') || 'Guest';

  function showToast(msg, type = 'success') {
    const toast = document.createElement('div');
    toast.className = `toast align-items-center text-bg-${type} border-0`;
    toast.innerHTML = `<div class="d-flex"><div class="toast-body">${msg}</div><button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button></div>`;
    document.querySelector('.toast-container').appendChild(toast);
    new bootstrap.Toast(toast, {delay: 4000}).show();
  }

  if (!token) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('snackbar').style.display = 'block';
    setTimeout(() => location.href = 'login.html', 3000);
  } else {
    loadProfile();
  }

  async function loadProfile() {
    try {
      const headers = { 'Authorization': `Bearer ${token}` };

      const [empRes, depRes] = await Promise.all([
        authFetch(`${API_BASE}/employees`, { headers }),
        authFetch(`${API_BASE}/departments`, { headers })
      ]);

      if (empRes.status === 401 || depRes.status === 401) {
        throw new Error('Phiên đăng nhập hết hạn. Vui lòng đăng nhập lại.');
      }
      if (!empRes.ok || !depRes.ok) {
        throw new Error('Không thể tải dữ liệu tổ chức.');
      }

      const employees = await empRes.json();
      const departments = await depRes.json();

      const avgAge = employees.length 
        ? (employees.reduce((sum, e) => sum + (e.age || 0), 0) / employees.length).toFixed(1) 
        : 0;

      document.getElementById('username').innerText = username;
      document.getElementById('avatar').innerText = (username[0] || 'U').toUpperCase();
      document.getElementById('emailChip').innerHTML = `<span class="material-icons">email</span> ${username}@example.com`;
      document.getElementById('employeeCount').innerText = employees.length;
      document.getElementById('departmentCount').innerText = departments.length;
      document.getElementById('averageAge').innerText = avgAge;

      document.getElementById('loading').style.display = 'none';
      document.getElementById('app').style.display = 'block';

    } catch (err) {
      showToast(err.message || 'Lỗi tải hồ sơ. Vui lòng thử lại.', 'danger');
      setTimeout(() => location.href = 'login.html', 3000);
    }
  }

  function logout() {
    localStorage.removeItem('token');
    localStorage.removeItem('EMSusername');
    showToast('Đăng xuất thành công!', 'success');
    setTimeout(() => location.href = 'login.html', 1500);
  }

  function go(path) {
    location.href = path;
  }

  function exportCSV() {
    const rows = [
      ['Field', 'Value'],
      ['Username', username],
      ['Email', `${username}@example.com`],
      ['Total Employees', document.getElementById('employeeCount').innerText],
      ['Total Departments', document.getElementById('departmentCount').innerText],
      ['Average Age', document.getElementById('averageAge').innerText],
      ['Generated At', new Date().toLocaleString()]
    ];
    const csv = rows.map(r => r.map(v => `"${v}"`).join(',')).join('\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = 'profile_snapshot.csv';
    link.click();
    showToast('Đã export snapshot thành công!', 'success');
  }
</script>
</body>
</html>
