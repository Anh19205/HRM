<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Reset Password</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Icons -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f3f4f6;
      padding: 16px;
    }

    .card {
      width: 100%;
      max-width: 400px;
      background: #fff;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.12);
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      font-weight: 700;
    }

    .form-group {
      margin-bottom: 16px;
      position: relative;
    }

    input {
      width: 100%;
      padding: 12px 40px 12px 12px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 14px;
    }

    input:disabled {
      background: #f0f0f0;
    }

    .toggle {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      color: #555;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      background: #1976d2;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .loading {
      text-align: center;
      font-size: 14px;
    }

    .error {
      color: red;
      text-align: center;
      margin-top: 12px;
    }

    .success {
      color: #1976d2;
      text-align: center;
      margin-top: 12px;
      font-weight: 600;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>Reset Password</h2>

  <form id="resetForm">
    <div class="form-group">
      <input type="text" id="username" placeholder="Username" disabled />
    </div>

    <div class="form-group">
      <input type="password" id="newPassword" placeholder="New Password" required />
      <span class="material-icons toggle" onclick="togglePassword('newPassword')">visibility</span>
    </div>

    <div class="form-group">
      <input type="password" id="confirmPassword" placeholder="Confirm New Password" required />
      <span class="material-icons toggle" onclick="togglePassword('confirmPassword')">visibility</span>
    </div>

    <button type="submit" id="submitBtn">Reset Password</button>
  </form>

  <div class="loading" id="loading" style="display:none;">Processing...</div>
  <div class="error" id="error"></div>
  <div class="success" id="success"></div>
</div>

<script>
  // Toggle password visibility
  function togglePassword(id) {
    const input = document.getElementById(id);
    input.type = input.type === 'password' ? 'text' : 'password';
  }

  const form = document.getElementById('resetForm');
  const errorEl = document.getElementById('error');
  const successEl = document.getElementById('success');
  const loadingEl = document.getElementById('loading');
  const submitBtn = document.getElementById('submitBtn');

  // Get username from query param
  const params = new URLSearchParams(window.location.search);
  const username = params.get('username');

  if (username) {
    document.getElementById('username').value = username;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorEl.textContent = '';
    successEl.textContent = '';

    const newPassword = document.getElementById('newPassword').value;
    const confirmPassword = document.getElementById('confirmPassword').value;

    if (newPassword !== confirmPassword) {
      errorEl.textContent = 'Passwords do not match.';
      return;
    }

    submitBtn.disabled = true;
    loadingEl.style.display = 'block';

    try {
      const res = await fetch('https://employee-management-app-gdm5.onrender.com/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: username,
          newPassword: newPassword
        })
      });

      submitBtn.disabled = false;
      loadingEl.style.display = 'none';

      if (res.ok) {
        successEl.textContent = 'Password reset successful! Redirecting to login...';
        setTimeout(() => {
          window.location.href = '/login';
        }, 2000);
      } else {
        const data = await res.json();
        errorEl.textContent = data.message || 'Error resetting password.';
      }
    } catch (err) {
      submitBtn.disabled = false;
      loadingEl.style.display = 'none';
      errorEl.textContent = 'Something went wrong. Please try again later.';
    }
  });
</script>

</body>
</html>
