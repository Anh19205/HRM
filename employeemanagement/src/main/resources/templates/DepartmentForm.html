<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Department Form</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

  <style>
    body {
      background: #f4f6f9;
      min-height: 100vh;
      display: flex;
      align-items: center;
    }
    .card {
      border-radius: 16px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.1);
      border: none;
    }
    .form-label {
      font-weight: 600;
      color: #495057;
    }
    .invalid-feedback {
      display: block;
    }
    .toast-container {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 1055;
    }
    #loading {
      position: fixed;
      inset: 0;
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }
  </style>
</head>

<body>

<!-- Loading overlay -->
<div id="loading">
  <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;" role="status">
    <span class="visually-hidden">Loading...</span>
  </div>
</div>

<!-- Toast container -->
<div class="toast-container"></div>

<div class="container">
  <div class="card p-4 mx-auto" style="max-width: 460px;">
    <div class="d-flex align-items-center mb-4">
      <span class="material-icons fs-1 me-2 text-primary">business</span>
      <h4 id="formTitle" class="mb-0">Thêm phòng ban mới</h4>
    </div>

    <form id="departmentForm" novalidate>
      <div class="mb-4">
        <label for="name" class="form-label">Tên phòng ban <span class="text-danger">*</span></label>
        <input
          type="text"
          class="form-control form-control-lg"
          id="name"
          name="name"
          placeholder="Ví dụ: Human Resources"
          required
          minlength="2"
          maxlength="100"
          aria-describedby="nameHelp nameFeedback"
        />
        <div id="nameHelp" class="form-text">Tên phòng ban phải từ 2-100 ký tự.</div>
        <div class="invalid-feedback" id="nameFeedback"></div>
      </div>

      <div class="d-grid gap-2">
        <button type="submit" class="btn btn-primary btn-lg" id="submitBtn">
          <span class="material-icons align-middle me-1">save</span>
          Lưu phòng ban
        </button>
        <a href="/departments" class="btn btn-outline-secondary">Quay lại</a>
      </div>
    </form>
  </div>
</div>

<script>
  const API_BASE = 'http://localhost:8080/api'; // ← Thay nếu deploy khác
  const form = document.getElementById('departmentForm');
  const nameInput = document.getElementById('name');
  const submitBtn = document.getElementById('submitBtn');
  const formTitle = document.getElementById('formTitle');
  const loading = document.getElementById('loading');

  // Lấy id từ URL (edit mode)
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');

  // ================== TOAST HELPER ==================
  function showToast(message, type = 'success') {
    const toast = document.createElement('div');
    toast.className = `toast align-items-center text-bg-${type} border-0`;
    toast.role = 'alert';
    toast.innerHTML = `
      <div class="d-flex">
        <div class="toast-body">${message}</div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
      </div>
    `;
    document.querySelector('.toast-container').appendChild(toast);
    new bootstrap.Toast(toast, { autohide: true, delay: 4000 }).show();
  }

  // ================== SHOW/HIDE LOADING ==================
  function toggleLoading(show) {
    loading.style.display = show ? 'flex' : 'none';
    submitBtn.disabled = show;
  }

  // ================== LOAD DATA (EDIT MODE) ==================
  async function loadDepartment() {
    if (!id) return;

    formTitle.innerHTML = '<span class="material-icons align-middle me-2">edit</span>Sửa phòng ban';
    toggleLoading(true);

    try {
      const res = await fetch(`${API_BASE}/departments/${id}`);
      if (!res.ok) throw new Error(await res.text() || 'Không tìm thấy phòng ban');

      const data = await res.json();
      nameInput.value = data.name || '';
      nameInput.focus();
    } catch (err) {
      showToast(`Lỗi tải dữ liệu: ${err.message}`, 'danger');
    } finally {
      toggleLoading(false);
    }
  }

  // ================== VALIDATION ==================
  function validateForm() {
    let isValid = true;
    const name = nameInput.value.trim();

    // Reset lỗi trước
    nameInput.classList.remove('is-invalid');
    document.getElementById('nameFeedback').textContent = '';

    if (!name) {
      nameInput.classList.add('is-invalid');
      document.getElementById('nameFeedback').textContent = 'Vui lòng nhập tên phòng ban';
      isValid = false;
    } else if (name.length < 2) {
      nameInput.classList.add('is-invalid');
      document.getElementById('nameFeedback').textContent = 'Tên phải ít nhất 2 ký tự';
      isValid = false;
    } else if (name.length > 100) {
      nameInput.classList.add('is-invalid');
      document.getElementById('nameFeedback').textContent = 'Tên không được vượt quá 100 ký tự';
      isValid = false;
    }

    return isValid;
  }

  // ================== SUBMIT FORM ==================
  form.addEventListener('submit', async e => {
    e.preventDefault();

    if (!validateForm()) {
      nameInput.focus();
      return;
    }

    toggleLoading(true);

    const department = {
      name: nameInput.value.trim()
    };

    try {
      const url = id ? `${API_BASE}/departments/${id}` : `${API_BASE}/departments`;
      const method = id ? 'PUT' : 'POST';

      const res = await fetch(url, {
        method,
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(department)
      });

      if (!res.ok) {
        const errorData = await res.json().catch(() => ({}));
        throw new Error(errorData.message || await res.text() || 'Lưu thất bại');
      }

      showToast(id ? 'Cập nhật phòng ban thành công!' : 'Thêm phòng ban thành công!', 'success');
      setTimeout(() => {
        window.location.href = 'departments.html';
      }, 1200);

    } catch (err) {
      showToast(err.message, 'danger');
      console.error('Save error:', err);
    } finally {
      toggleLoading(false);
    }
  });

  // Real-time validation (optional - khi blur)
  nameInput.addEventListener('blur', validateForm);

  // Load data nếu là edit
  loadDepartment();
</script>

<!-- Bootstrap JS (cho toast) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
