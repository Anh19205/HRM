<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Nhân viên & Hợp đồng</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    body { background: #f4f6f9; min-height: 100vh; display: flex; align-items: center; font-family: system-ui, sans-serif; }
    .container { max-width: 620px; background: white; border-radius: 16px; box-shadow: 0 12px 40px rgba(0,0,0,0.1); padding: 2.5rem; }
    h2 { color: #1976d2; }
    .form-label { font-weight: 600; }
    .invalid-feedback { display: block; }
    #loading { position: fixed; inset: 0; background: rgba(255,255,255,0.9); display: none; align-items: center; justify-content: center; z-index: 9999; }
    .toast-container { position: fixed; top: 20px; right: 20px; z-index: 1050; }
    .nav-tabs .nav-link { font-weight: 500; }
    .required::after { content: " *"; color: #dc3545; }
  </style>
</head>
<body>

<div id="loading">
  <div class="spinner-border text-primary" style="width:3rem;height:3rem;"></div>
</div>

<div class="toast-container"></div>

<div class="container">
  <h2 id="formTitle">Thêm nhân viên mới</h2>

  <ul class="nav nav-tabs mb-4" id="employeeTabs" role="tablist">
    <li class="nav-item" role="presentation">
      <button class="nav-link active" id="personal-tab" data-bs-toggle="tab" data-bs-target="#personal" type="button" role="tab">Thông tin cá nhân</button>
    </li>
    <li class="nav-item" role="presentation">
      <button class="nav-link" id="contract-tab" data-bs-toggle="tab" data-bs-target="#contract" type="button" role="tab">Hợp đồng lao động</button>
    </li>
  </ul>

  <form id="employeeForm" novalidate>
    <input type="hidden" id="employeeId">

    <div class="tab-content">
      <!-- Tab 1: Thông tin cá nhân -->
      <div class="tab-pane fade show active" id="personal" role="tabpanel">
        <div class="mb-3">
          <label class="form-label">Họ</label>
          <input type="text" class="form-control" id="firstName" required minlength="2">
          <div class="invalid-feedback">Họ phải từ 2 ký tự trở lên</div>
        </div>

        <div class="mb-3">
          <label class="form-label">Tên</label>
          <input type="text" class="form-control" id="lastName" required minlength="2">
          <div class="invalid-feedback">Tên phải từ 2 ký tự trở lên</div>
        </div>

        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" id="email" required>
          <div class="invalid-feedback">Email không hợp lệ</div>
        </div>

        <div class="mb-3">
          <label class="form-label">Tuổi</label>
          <input type="number" class="form-control" id="age" min="18" max="65" required>
          <div class="invalid-feedback">Tuổi từ 18-65</div>
        </div>

        <div class="mb-4">
          <label class="form-label">Phòng ban</label>
          <select class="form-select" id="department" required>
            <option value="">Chọn phòng ban</option>
          </select>
          <div class="invalid-feedback">Vui lòng chọn phòng ban</div>
        </div>
      </div>

      <!-- Tab 2: Hợp đồng lao động -->
      <div class="tab-pane fade" id="contract" role="tabpanel">
        <input type="hidden" id="contractId">

        <div class="mb-3">
          <label class="form-label required">Loại hợp đồng</label>
          <select class="form-select" id="contractType" required>
            <option value="">Chọn loại...</option>
            <option value="FULL_TIME">Toàn thời gian</option>
            <option value="PART_TIME">Bán thời gian</option>
            <option value="INTERN">Thực tập</option>
          </select>
          <div class="invalid-feedback">Vui lòng chọn loại hợp đồng</div>
        </div>

        <div class="mb-3">
          <label class="form-label required">Mức lương (VND)</label>
          <input type="number" class="form-control" id="salary" min="1000000" required>
          <div class="invalid-feedback">Lương tối thiểu 1.000.000 ₫</div>
        </div>

        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label required">Ngày bắt đầu</label>
            <input type="date" class="form-control" id="startDate" required>
            <div class="invalid-feedback">Vui lòng chọn ngày bắt đầu</div>
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label">Ngày kết thúc</label>
            <input type="date" class="form-control" id="endDate">
          </div>
        </div>

        <div class="alert alert-info mt-3 small">
          <strong>Lưu ý:</strong> Mỗi nhân viên bắt buộc phải có ít nhất một hợp đồng khi tạo mới.
        </div>
      </div>
    </div>

    <button type="submit" class="btn btn-primary w-100 btn-lg mt-4" id="submitBtn">Lưu thông tin</button>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
// Các hàm authFetch, showToast, loading... giữ nguyên như cũ
function authFetch(url, options = {}) {
  const token = localStorage.getItem("token");
  return fetch(url, {
    ...options,
    headers: {
      "Content-Type": "application/json",
      "Authorization": "Bearer " + token,
      ...(options.headers || {})
    }
  });
}

const API_BASE = '/api';
const form = document.getElementById('employeeForm');
const loading = document.getElementById('loading');
const submitBtn = document.getElementById('submitBtn');
const title = document.getElementById('formTitle');
const idInput = document.getElementById('employeeId');
const isEditMode = !!new URLSearchParams(window.location.search).get('id');

// Toast
function showToast(msg, type = 'success') {
  const toast = document.createElement('div');
  toast.className = `toast align-items-center text-bg-${type} border-0`;
  toast.innerHTML = `<div class="d-flex"><div class="toast-body">${msg}</div><button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button></div>`;
  document.querySelector('.toast-container').appendChild(toast);
  new bootstrap.Toast(toast, {delay: 4000}).show();
}

// Load phòng ban
async function loadDepartments() {
  try {
    const res = await authFetch(`${API_BASE}/departments`);
    if (!res.ok) throw new Error('Tải phòng ban thất bại');
    const deps = await res.json();
    const select = document.getElementById('department');
    select.innerHTML = '<option value="">Chọn phòng ban</option>';
    deps.forEach(d => {
      select.innerHTML += `<option value="${d.id}">${d.name}</option>`;
    });
  } catch (err) {
    showToast('Lỗi tải phòng ban: ' + err.message, 'danger');
  }
}

// Load dữ liệu khi sửa (cả employee & contract)
async function loadEmployee(id) {
  try {
    const res = await authFetch(`${API_BASE}/employees/${id}`);
    if (!res.ok) throw new Error('Không tìm thấy nhân viên');
    const emp = await res.json();

    title.textContent = 'Sửa thông tin nhân viên';
    idInput.value = emp.id;

    document.getElementById('firstName').value = emp.firstName;
    document.getElementById('lastName').value = emp.lastName;
    document.getElementById('email').value = emp.email;
    document.getElementById('age').value = emp.age;
    document.getElementById('department').value = emp.department?.id || '';

    // Load hợp đồng nếu có
    if (emp.contract) {
      document.getElementById('contractId').value = emp.contract.id;
      document.getElementById('contractType').value = emp.contract.contractType;
      document.getElementById('salary').value = emp.contract.salary;
      document.getElementById('startDate').value = emp.contract.startDate;
      document.getElementById('endDate').value = emp.contract.endDate || '';

      // Có thể disable một số field nếu không muốn sửa hợp đồng khi edit
      // document.getElementById('contractType').disabled = true;
    }
  } catch (err) {
    showToast('Lỗi tải dữ liệu: ' + err.message, 'danger');
  }
}

form.addEventListener('submit', async e => {
  e.preventDefault();
  if (!form.checkValidity()) {
    form.reportValidity();
    return;
  }

  // Bắt buộc hợp đồng khi tạo mới
  if (!isEditMode && !document.getElementById('contractType').value) {
    showToast('Vui lòng điền thông tin hợp đồng!', 'danger');
    new bootstrap.Tab(document.getElementById('contract-tab')).show();
    return;
  }

  loading.style.display = 'flex';
  submitBtn.disabled = true;

  const employeeData = {
    firstName: document.getElementById('firstName').value.trim(),
    lastName: document.getElementById('lastName').value.trim(),
    email: document.getElementById('email').value.trim(),
    age: parseInt(document.getElementById('age').value),
    department: { id: parseInt(document.getElementById('department').value) }
  };

  const contractData = {
    contractType: document.getElementById('contractType').value,
    salary: parseFloat(document.getElementById('salary').value),
    startDate: document.getElementById('startDate').value,
    endDate: document.getElementById('endDate').value || null
  };

  const payload = { employee: employeeData, contract: contractData };

  const empId = idInput.value;
  const url = empId ? `${API_BASE}/employees/${empId}/with-contract` : `${API_BASE}/employees/with-contract`;
  const method = empId ? 'PUT' : 'POST';

  try {
    const res = await authFetch(url, {
      method,
      body: JSON.stringify(payload)
    });

    if (!res.ok) {
      const errData = await res.json().catch(() => ({}));
      throw new Error(errData.message || 'Lưu thất bại');
    }

    showToast(empId ? 'Cập nhật thành công!' : 'Thêm nhân viên & hợp đồng thành công!', 'success');
    setTimeout(() => window.location.href = '/employees', 1500);
  } catch (err) {
    showToast('Lỗi: ' + err.message, 'danger');
  } finally {
    loading.style.display = 'none';
    submitBtn.disabled = false;
  }
});

// Khởi tạo
loadDepartments();

const params = new URLSearchParams(window.location.search);
const editId = params.get('id');
if (editId) loadEmployee(editId);
</script>
</body>
</html>
