<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Lịch làm việc nhân viên</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: #f4f6f9;
      padding: 2rem;
      font-family: system-ui, sans-serif;
    }
    .card {
      border-radius: 14px;
      box-shadow: 0 6px 16px rgba(0,0,0,.08);
    }
  </style>
</head>

<body>

<div class="container">

  <!-- HEADER -->
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2 id="employeeName">📅 Lịch làm việc</h2>
    <div>
      <a href="/employees" class="btn btn-outline-secondary me-2">← Quay lại</a>
      <button class="btn btn-primary" onclick="openAddModal()">➕ Thêm ca</button>
    </div>
  </div>

  <!-- TABLE -->
  <div class="card">
    <div class="card-body p-0">
      <table class="table table-hover mb-0">
        <thead class="table-light">
          <tr>
            <th>Ngày</th>
            <th>Ca</th>
            <th>Bắt đầu</th>
            <th>Kết thúc</th>
            <th width="120">Thao tác</th>
          </tr>
        </thead>
        <tbody id="scheduleBody">
          <tr>
            <td colspan="5" class="text-center text-muted">Đang tải...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</div>

<!-- MODAL ADD / EDIT -->
<div class="modal fade" id="scheduleModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title" id="modalTitle">Thêm ca làm</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        <input type="hidden" id="scheduleId">

        <div class="mb-3">
          <label class="form-label">Ngày làm</label>
          <input type="date" id="workDate" class="form-control">
        </div>

        <div class="row">
          <div class="col">
            <label class="form-label">Giờ bắt đầu</label>
            <input type="time" id="startTime" class="form-control">
          </div>
          <div class="col">
            <label class="form-label">Giờ kết thúc</label>
            <input type="time" id="endTime" class="form-control">
          </div>
        </div>

        <div class="mt-3">
          <label class="form-label">Ca</label>
          <select id="shift" class="form-select">
            <option value="Morning">Sáng</option>
            <option value="Afternoon">Chiều</option>
            <option value="Night">Tối</option>
            <option value="Full">Cả ngày</option>
          </select>
        </div>
      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
        <button class="btn btn-primary" onclick="saveSchedule()">Lưu</button>
      </div>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
const API = '/api';

/* ================== AUTH FETCH ================== */
function authFetch(url, options = {}) {
  return fetch(url, {
    ...options,
    headers: {
      'Authorization': 'Bearer ' + localStorage.getItem('token'),
      'Content-Type': 'application/json',
      ...(options.headers || {})
    }
  });
}

/* ================== GET EMPLOYEE ID ================== */
function getEmployeeId() {
  return new URLSearchParams(window.location.search).get('employeeId');
}

/* ================== LOAD DATA ================== */
async function loadEmployeeSchedule() {
  const employeeId = getEmployeeId();
  if (!employeeId) return;

  /* employee info */
  const empRes = await authFetch(`${API}/employees/${employeeId}`);
  const emp = await empRes.json();
  document.getElementById('employeeName').textContent =
    `📅 Lịch làm việc: ${emp.firstName} ${emp.lastName}`;

  /* schedules */
  const res = await authFetch(`${API}/workschedules/employee/${employeeId}`);
  const schedules = await res.json();

  renderTable(schedules);
}

/* ================== RENDER TABLE ================== */
function renderTable(schedules) {
  const body = document.getElementById('scheduleBody');

  if (schedules.length === 0) {
    body.innerHTML =
      '<tr><td colspan="5" class="text-center text-muted">Chưa có ca làm</td></tr>';
    return;
  }

  body.innerHTML = schedules.map(s => `
    <tr>
      <td>${s.workDate}</td>
      <td><span class="badge bg-info">${s.shift}</span></td>
      <td>${s.startTime}</td>
      <td>${s.endTime}</td>
      <td>
        <button class="btn btn-sm btn-outline-primary me-1"
          onclick='openEditModal(${JSON.stringify(s)})'>✏️</button>
        <button class="btn btn-sm btn-outline-danger"
          onclick="deleteSchedule(${s.id})">🗑</button>
      </td>
    </tr>
  `).join('');
}

/* ================== OPEN MODALS ================== */
function openAddModal() {
  document.getElementById('modalTitle').textContent = 'Thêm ca làm';
  document.getElementById('scheduleId').value = '';
  document.getElementById('workDate').value = '';
  document.getElementById('startTime').value = '';
  document.getElementById('endTime').value = '';
  document.getElementById('shift').value = 'Morning';

  new bootstrap.Modal(document.getElementById('scheduleModal')).show();
}

function openEditModal(s) {
  document.getElementById('modalTitle').textContent = 'Sửa ca làm';
  document.getElementById('scheduleId').value = s.id;
  document.getElementById('workDate').value = s.workDate;
  document.getElementById('startTime').value = s.startTime.substring(0,5);
  document.getElementById('endTime').value = s.endTime.substring(0,5);
  document.getElementById('shift').value = s.shift;

  new bootstrap.Modal(document.getElementById('scheduleModal')).show();
}

/* ================== SAVE ================== */
async function saveSchedule() {
  const employeeId = getEmployeeId();
  const id = document.getElementById('scheduleId').value;

  const data = {
    workDate: document.getElementById('workDate').value,
    startTime: document.getElementById('startTime').value + ':00',
    endTime: document.getElementById('endTime').value + ':00',
    shift: document.getElementById('shift').value,
    employee: { id: Number(employeeId) }
  };

  let url = `${API}/workschedules`;
  let method = 'POST';

  if (id) {
    url += '/' + id;
    method = 'PUT';
  }

  const res = await authFetch(url, {
    method,
    body: JSON.stringify(data)
  });

  if (!res.ok) {
    alert('Lỗi lưu ca làm');
    return;
  }

  bootstrap.Modal.getInstance(document.getElementById('scheduleModal')).hide();
  loadEmployeeSchedule();
}

/* ================== DELETE ================== */
async function deleteSchedule(id) {
  if (!confirm('Xóa ca làm?')) return;
  await authFetch(`${API}/workschedules/${id}`, { method: 'DELETE' });
  loadEmployeeSchedule();
}

/* INIT */
loadEmployeeSchedule();
</script>

</body>
</html>
