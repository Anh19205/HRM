<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng ký tài khoản</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #1E3C72, #2A5298);
      padding: 16px;
      color: #fff;
    }

    .card {
      width: 100%;
      max-width: 960px;
      display: grid;
      grid-template-columns: 1fr 0.9fr;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 25px 70px rgba(0,0,0,0.3);
      background: white;
    }

    .left {
      background: linear-gradient(135deg, #f6d365, #fda085);
      padding: 48px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 24px;
      color: #1a1a1a;
    }

    .left h1 {
      font-size: 32px;
      font-weight: 800;
      margin: 0;
    }

    .feature {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 15px;
      font-weight: 500;
    }

    .right {
      padding: 48px;
      background: white;
    }

    .right h2 {
      text-align: center;
      margin-bottom: 32px;
      color: #1976d2;
      font-weight: 700;
    }

    .form-group {
      margin-bottom: 24px;
      position: relative;
    }

    .form-control {
      padding: 14px 48px 14px 16px;
      border-radius: 8px;
      border: 1px solid #ced4da;
      transition: border-color 0.2s;
    }

    .form-control:focus {
      border-color: #1976d2;
      box-shadow: 0 0 0 0.25rem rgba(25,118,210,0.15);
    }

    .toggle {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      color: #6c757d;
      font-size: 20px;
    }

    .btn-register {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #1976d2;
      color: white;
      font-size: 16px;
      font-weight: 600;
      transition: background 0.2s;
    }

    .btn-register:hover:not(:disabled) {
      background: #1565c0;
    }

    .btn-register:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .error-message {
      color: #dc3545;
      font-size: 14px;
      text-align: center;
      margin-top: 12px;
      min-height: 20px;
    }

    .login-link {
      text-align: center;
      margin-top: 24px;
      color: #495057;
    }

    .login-link a {
      color: #1976d2;
      text-decoration: none;
      font-weight: 600;
    }

    .login-link a:hover {
      text-decoration: underline;
    }

    .toast-container {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 1050;
    }

    @media (max-width: 768px) {
      .card {
        grid-template-columns: 1fr;
      }
      .left {
        padding: 40px;
      }
    }
  </style>
</head>
<body>

<div class="card">
  <!-- LEFT SIDE -->
  <div class="left">
    <h1>Tạo tài khoản</h1>
    <p>Tham gia hệ thống Quản lý Nhân viên để quản lý phòng ban và nhân viên một cách dễ dàng.</p>

    <div class="feature">
      <span class="material-icons">rocket_launch</span>
      Sẵn sàng sử dụng chỉ trong vài phút
    </div>
    <div class="feature">
      <span class="material-icons">security</span>
      Bảo mật cao với Spring Security
    </div>
    <div class="feature">
      <span class="material-icons">check_circle</span>
      Dữ liệu sẵn sàng export
    </div>
  </div>

  <!-- RIGHT SIDE - FORM -->
  <div class="right">
    <h2>Đăng ký</h2>

    <form id="registerForm" novalidate>
      <div class="form-group">
        <input type="text" class="form-control" id="username" placeholder="Tên đăng nhập" required minlength="4" maxlength="50">
      </div>

      <div class="form-group">
        <input type="password" class="form-control" id="password" placeholder="Mật khẩu" required minlength="6">
        <span class="material-icons toggle" id="togglePassword">visibility</span>
      </div>

      <div class="form-group">
        <input type="password" class="form-control" id="confirmPassword" placeholder="Xác nhận mật khẩu" required>
        <span class="material-icons toggle" id="toggleConfirm">visibility</span>
      </div>

      <button type="submit" class="btn-register" id="submitBtn">Đăng ký</button>
    </form>

    <div class="error-message" id="errorMessage"></div>

    <div class="login-link">
      Đã có tài khoản? <a href="/login">Đăng nhập</a>
    </div>
  </div>
</div>

<!-- Toast container -->
<div class="toast-container"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
  
const API_BASE = 'http://localhost:8080';
  const REGISTER_ENDPOINT = '/api/auth/register'; // ← Endpoint phổ biến nhất cho Spring Boot + Security

  const form = document.getElementById('registerForm');
  const errorMessage = document.getElementById('errorMessage');
  const submitBtn = document.getElementById('submitBtn');

  // Toggle password visibility
  document.getElementById('togglePassword').addEventListener('click', () => toggleVisibility('password'));
  document.getElementById('toggleConfirm').addEventListener('click', () => toggleVisibility('confirmPassword'));

  function toggleVisibility(id) {
    const input = document.getElementById(id);
    const icon = document.getElementById(id === 'password' ? 'togglePassword' : 'toggleConfirm');
    input.type = input.type === 'password' ? 'text' : 'password';
    icon.textContent = input.type === 'password' ? 'visibility' : 'visibility_off';
  }

  // Show toast notification
  function showToast(message, type = 'success') {
    const toastEl = document.createElement('div');
    toastEl.className = `toast align-items-center text-bg-${type} border-0`;
    toastEl.innerHTML = `
      <div class="d-flex">
        <div class="toast-body">${message}</div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
      </div>
    `;
    document.querySelector('.toast-container').appendChild(toastEl);
    new bootstrap.Toast(toastEl, { autohide: true, delay: 5000 }).show();
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorMessage.textContent = '';

    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;

    // Client-side validation
    if (!username || username.length < 4) {
      errorMessage.textContent = 'Tên đăng nhập phải từ 4 ký tự trở lên.';
      return;
    }
    if (!password || password.length < 6) {
      errorMessage.textContent = 'Mật khẩu phải từ 6 ký tự trở lên.';
      return;
    }
    if (password !== confirmPassword) {
      errorMessage.textContent = 'Mật khẩu xác nhận không khớp.';
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Đang đăng ký...';

    try {
      const res = await fetch(`${API_BASE}${REGISTER_ENDPOINT}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });

      if (res.ok) {
        showToast('Đăng ký thành công! Đang chuyển đến trang đăng nhập...', 'success');
        setTimeout(() => {
          window.location.href = '/login';
        }, 2000);
      } else {
        const data = await res.json().catch(() => ({}));
        errorMessage.textContent = data.message || 'Đăng ký thất bại. Tên đăng nhập có thể đã tồn tại.';
      }
    } catch (err) {
      errorMessage.textContent = 'Lỗi kết nối server. Vui lòng thử lại.';
      console.error(err);
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Đăng ký';
    }
  });
</script>
</body>
</html>
