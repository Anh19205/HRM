
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>404 - Page Not Found</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f8;
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      text-align: center;
      padding: 4rem 1rem;
      max-width: 600px;
      background: #ffffff;
      border-radius: 10px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
    }

    .error-code {
      font-size: 96px;
      font-weight: bold;
      color: #d32f2f;
      margin-bottom: 16px;
    }

    .title {
      font-size: 24px;
      margin-bottom: 12px;
    }

    .description {
      font-size: 16px;
      color: #555;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    button {
      background-color: #1976d2;
      color: #fff;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background-color: #1565c0;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="error-code">404</div>
    <div class="title">Oops! The page you're looking for doesn't exist.</div>
    <div class="description">
      It seems the page you are trying to access is not available or you have typed the wrong URL.
    </div>
    <button onclick="goHome()">Go Back to Home</button>
  </div>

  <script>
    function goHome() {
      window.location.href = '/'; 
      // hoặc '/index.html' nếu bạn dùng HTML thuần
    }
  </script>

</body>
</html>
